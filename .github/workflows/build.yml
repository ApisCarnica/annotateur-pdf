# Fabrique l'installateur Windows (.exe) et le publie comme release
# v<version de package.json>, source des mises à jour automatiques.
# Lancement : onglet Actions > Run workflow.
name: Construire l'installateur Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
